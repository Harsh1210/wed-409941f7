<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..800&display=swap" rel="stylesheet">
<style>
@page{size:Letter;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Archivo',sans-serif;background:#fff;color:#3d1526;
  width:8.5in;height:11in;padding:.72in .65in;
  display:flex;flex-direction:column;-webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.sheettop{display:flex;justify-content:space-between;align-items:baseline;
  font-size:7.5pt;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#b08a78;
  padding-bottom:9px;border-bottom:1px solid #f0e4de;margin-bottom:.34in}

.ticket{
  display:flex;height:3.05in;border-radius:15px;overflow:hidden;position:relative;
  box-shadow:0 0 0 1px #eeddd4;
}
.body{
  flex:1;background:#3d1526;color:#fff3e4;padding:.28in .34in .26in;
  display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;
}
.body::after{content:"";position:absolute;right:-1.5in;bottom:-1.9in;width:3.4in;height:3.4in;
  border-radius:50%;background:radial-gradient(circle,rgba(255,120,80,.34),transparent 68%)}
.body::before{content:"";position:absolute;left:-1.1in;top:-1.5in;width:2.8in;height:2.8in;
  border-radius:50%;background:radial-gradient(circle,rgba(255,166,43,.30),transparent 68%)}
.body > *{position:relative;z-index:1}

.topline{display:flex;align-items:center;gap:9px}
.mark{color:#ffa62b;display:block;width:19px;height:19px;flex:none}
.glass{width:19px;height:19px;display:block}
.series{font-size:6.9pt;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#e3a88f}
.round{margin-left:auto;font-size:6.9pt;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:#3d1526;background:#ffa62b;padding:3px 9px;border-radius:99px}

.admit{font-size:7pt;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:#ffa62b;margin-bottom:2px}
.name{font-family:'Fraunces',serif;font-weight:700;font-size:46pt;line-height:.92;letter-spacing:-.022em;
  font-variation-settings:'SOFT' 55,'WONK' 1,'opsz' 100;color:#fff}
.tag{font-family:'Fraunces',serif;font-style:italic;font-size:10.5pt;color:#efb79c;margin-top:5px;
  font-variation-settings:'SOFT' 60,'WONK' 1}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px;
  border-top:1px solid rgba(227,168,143,.30);border-bottom:1px solid rgba(227,168,143,.30);padding:9px 0}
.grid span{display:block;font-size:6.2pt;font-weight:700;letter-spacing:.19em;text-transform:uppercase;color:#d3937a;margin-bottom:2px}
.grid b{font-size:10pt;font-weight:600;color:#fff3e4;letter-spacing:-.01em}

.fine{font-size:7.2pt;letter-spacing:.05em;color:#d8a08a}

.stub{
  width:1.42in;background:#ffa62b;color:#3d1526;position:relative;
  border-left:2.5px dashed #3d1526;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:.2in 0 .17in;
}
.notch{position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:#fff}
.notch.top{top:-8px}
.notch.bot{bottom:-8px}
.stubno{font-size:6.6pt;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.keep{font-family:'Fraunces',serif;font-style:italic;font-weight:700;font-size:22pt;
  font-variation-settings:'SOFT' 80,'WONK' 1;transform:rotate(-6deg)}
.bars{display:flex;gap:2px;align-items:flex-end;height:26px;width:1.06in;justify-content:center;overflow:hidden}
.bars i{display:block;height:100%;background:#3d1526}
.stubfoot{font-size:7pt;font-weight:700;letter-spacing:.26em;text-transform:uppercase}
</style></head><body>

<div class="sheettop"><span>One ticket &middot; keep the stub</span><span>NoMa &middot; Washington DC</span></div>

<div class="ticket">
  <div class="body">
    <div class="topline">
      <span class="mark"><svg class="glass" viewBox="0 0 64 64" fill="none">
        <path d="M11 15h42L32 38z" fill="currentColor"/>
        <path d="M32 38v14" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <path d="M20 54h24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <circle cx="44" cy="10" r="3.4" fill="currentColor" opacity=".85"/>
      </svg></span>
      <span class="series">Happy Hour &middot; Washington DC</span>
      <span class="round">Tonight</span>
    </div>

    <div class="hero">
      <p class="admit">Admit</p>
      <h1 class="name">Ram</h1>
      <p class="tag">One drink &middot; no agenda &middot; no rush</p>
    </div>

    <div class="grid">
      <div><span>Date</span><b>Tue 11 Aug</b></div>
      <div><span>Call time</span><b>5:00 PM</b></div>
      <div><span>Meet at</span><b>Starbucks, NoMa</b></div>
    </div>

    <p class="fine">Admit one &nbsp;&middot;&nbsp; Non-transferable &nbsp;&middot;&nbsp; First round's on the ticket</p>
  </div>

  <div class="stub">
    <span class="notch top"></span><span class="notch bot"></span>
    <p class="stubno">No. 001</p>
    <p class="keep">Keep&nbsp;me</p>
    <div class="bars"><i style="width:2px"></i><i style="width:1px"></i><i style="width:3px"></i><i style="width:1px"></i><i style="width:2px"></i><i style="width:2px"></i><i style="width:1px"></i><i style="width:3px"></i><i style="width:2px"></i><i style="width:1px"></i><i style="width:1px"></i><i style="width:2px"></i><i style="width:3px"></i><i style="width:1px"></i><i style="width:2px"></i><i style="width:1px"></i><i style="width:3px"></i><i style="width:2px"></i><i style="width:1px"></i><i style="width:2px"></i><i style="width:3px"></i><i style="width:1px"></i><i style="width:2px"></i><i style="width:3px"></i><i style="width:1px"></i><i style="width:2px"></i><i style="width:1px"></i><i style="width:3px"></i><i style="width:2px"></i><i style="width:1px"></i><i style="width:2px"></i><i style="width:3px"></i><i style="width:3px"></i><i style="width:1px"></i><i style="width:2px"></i><i style="width:3px"></i><i style="width:2px"></i><i style="width:1px"></i><i style="width:3px"></i><i style="width:2px"></i><i style="width:1px"></i><i style="width:1px"></i><i style="width:2px"></i><i style="width:3px"></i><i style="width:2px"></i><i style="width:3px"></i></div>
    <p class="stubfoot">Admit One</p>
  </div>
</div>

</body></html>
